name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sdk:
    name: .NET SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore tests/SwitchOnYourCode.Tests/SwitchOnYourCode.Tests.csproj

      - name: Verify formatting
        run: |
          dotnet format src/SwitchOnYourCode/SwitchOnYourCode.csproj --verify-no-changes --no-restore
          dotnet format src/SwitchOnYourCode.Extensions.DependencyInjection/SwitchOnYourCode.Extensions.DependencyInjection.csproj --verify-no-changes --no-restore
          dotnet format src/SwitchOnYourCode.OpenFeature/SwitchOnYourCode.OpenFeature.csproj --verify-no-changes --no-restore
          dotnet format tests/SwitchOnYourCode.Tests/SwitchOnYourCode.Tests.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build tests/SwitchOnYourCode.Tests/SwitchOnYourCode.Tests.csproj --configuration Release --no-restore

      - name: Test .NET 8
        run: dotnet run --project tests/SwitchOnYourCode.Tests/SwitchOnYourCode.Tests.csproj --framework net8.0 --configuration Release --no-build

      - name: Test .NET 10
        run: dotnet run --project tests/SwitchOnYourCode.Tests/SwitchOnYourCode.Tests.csproj --framework net10.0 --configuration Release --no-build

      - name: Pack native SDK
        run: dotnet pack src/SwitchOnYourCode/SwitchOnYourCode.csproj --configuration Release --no-build --output artifacts

      - name: Pack dependency injection integration
        run: dotnet pack src/SwitchOnYourCode.Extensions.DependencyInjection/SwitchOnYourCode.Extensions.DependencyInjection.csproj --configuration Release --no-build --output artifacts

      - name: Pack OpenFeature integration
        run: dotnet pack src/SwitchOnYourCode.OpenFeature/SwitchOnYourCode.OpenFeature.csproj --configuration Release --no-build --output artifacts

      - name: Verify NuGet packages
        shell: bash
        run: test "$(find artifacts -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 3
